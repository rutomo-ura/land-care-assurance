<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LandCare Contractor Portal</title>
  </head>
  <body>
    <p>Opening the <a id="contractorLink" href="../contractor/?tab=submit">LandCare Contractor Portal</a>...</p>
    <script>
      (() => {
        const target = new URL("../contractor/", window.location.href);
        const current = new URL(window.location.href);
        current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
        target.searchParams.set("tab", "submit");
        document.getElementById("contractorLink").href = target.href;
        window.location.replace(target.href);
      })();
    </script>
  </body>
</html>
